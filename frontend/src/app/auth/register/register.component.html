<div class="auth-container">

  <div class="auth-card">

    <h2>Crear cuenta</h2>

    <!-- NAME -->
    <input
      type="text"
      placeholder="Nombre"
      [(ngModel)]="name"
    />

    <!-- EMAIL -->
    <input
      type="email"
      placeholder="Correo"
      [(ngModel)]="email"
    />

    <!-- PASSWORD -->
    <input
      type="password"
      placeholder="Contraseña"
      [(ngModel)]="password"
    />

    <!-- ERROR -->
    <p
      class="error"
      *ngIf="error"
    >
      {{ error }}
    </p>

    <!-- BUTTON REGISTER -->
    <button
      (click)="register()"
      [disabled]="loading"
    >

      {{
        loading
        ? 'Registrando...'
        : 'Registrarse'
      }}

    </button>

    <!-- LOGIN -->
    <p class="link">

      ¿Ya tienes cuenta?

      <a (click)="goToLogin()">
        Iniciar sesión
      </a>

    </p>

  </div>

</div>
